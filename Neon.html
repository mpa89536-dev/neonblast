    if(r > w/2) r = w/2; if(r > h/2) r = h/2;
    this.moveTo(x+r,y);
    this.arcTo(x+w,y,x+w,y+h,r);
    this.arcTo(x+w,y+h,x,y+h,r);
    this.arcTo(x,y+h,x,y,r);
    this.arcTo(x,y,x+w,y,r);
    this.closePath();
    return this;
  };
}

    return v ? JSON.parse(v) : JSON.parse(JSON.stringify(def));

/* ═══════════ AUDIO ═══════════ */
let actx = null;
function initAudio(){
  if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ actx = null; } }
  if(actx && actx.state === 'suspended') actx.resume();
}
function tone(freq, dur, type, vol, slideTo){
  if(!actx) return;
  const t = actx.currentTime;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, t);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t+dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol || 0.06, t+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t); o.stop(t+dur+0.03);
}
function noise(dur, vol){
  if(!actx) return;
  const t = actx.currentTime;
  const len = Math.floor(actx.sampleRate*dur);
  const buf = actx.createBuffer(1, len, actx.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i] = (Math.random()*2-1)*(1-i/len);
  const src = actx.createBufferSource(); src.buffer = buf;
  const g = actx.createGain(); g.gain.value = vol || 0.15;
  const f = actx.createBiquadFilter(); f.type='lowpass'; f.frequency.value = 1400;
  src.connect(f); f.connect(g); g.connect(actx.destination);
  src.start(t);
}
const SFX = {
  place(){ tone(180, 0.08, 'square', 0.05); },
  clear(n){ const b = 420+n*90; tone(b,0.13,'triangle',0.07); setTimeout(function(){tone(b*1.5,0.16,'triangle',0.06);},70); if(n>1) setTimeout(function(){tone(b*2,0.2,'sine',0.05);},150); },
  combo(c){ tone(600+c*80,0.2,'sine',0.06,1200+c*100); },
  bomb(){ noise(0.35,0.22); tone(90,0.3,'sawtooth',0.07,40); },
  undo(){ tone(500,0.12,'sine',0.05,250); },
  shuffle(){ tone(300,0.1,'square',0.04); setTimeout(function(){tone(500,0.1,'square',0.04);},60); },
  over(){ tone(300,0.5,'sawtooth',0.07,90); setTimeout(function(){tone(200,0.6,'sine',0.06,60);},180); },
  ach(){ tone(660,0.15,'sine',0.08); setTimeout(function(){tone(880,0.2,'sine',0.07);},100); setTimeout(function(){tone(1100,0.25,'sine',0.06);},200); },
};

/* ═══════════ TOASTS ═══════════ */
function toast(icon, text, color){
  toasts.push({icon:icon, text:text, color:color||'#6ee7ff', life:1, delay:0});
}
function drawToasts(){
  let y = 14;
  for(let i=0;i<toasts.length;i++){
    const t = toasts[i];
    if(t.delay > 0){ t.delay -= 0.016; continue; }
    t.life -= 0.006;
    if(t.life <= 0) continue;
    const a = Math.min(1, t.life*2.5);
    const w = 320, h = 44, x = W/2-w/2;
    ctx.globalAlpha = a;
    ctx.save();
    ctx.shadowColor = t.color; ctx.shadowBlur = 18;
    ctx.fillStyle = 'rgba(15,10,30,0.97)';
    ctx.beginPath(); ctx.roundRect(x,y,w,h,12); ctx.fill();
    ctx.restore();
    ctx.strokeStyle = t.color; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.roundRect(x,y,w,h,12); ctx.stroke();
    ctx.font = '20px system-ui,"Apple Color Emoji","Segoe UI Emoji"';
    ctx.textAlign='left'; ctx.textBaseline='middle';
    ctx.fillStyle = '#fff';
    ctx.fillText(t.icon, x+14, y+h/2);
    ctx.font = 'bold 12px system-ui,sans-serif';
    ctx.fillText(t.text, x+44, y+h/2);
    y += h + 6;
  }
  ctx.globalAlpha = 1;
  toasts = toasts.filter(function(t){ return t.life > 0; });
}

/* ═══════════ ACHIEVEMENTS ═══════════ */
function unlockAch(id){
  if(achievements[id]) return;
  achievements[id] = Date.now();
  saveJSON('neonblast_ach', achievements);
  const a = ACHIEVEMENTS.find(function(x){ return x.id === id; });
  if(a){
    toast(a.icon, 'Достижение: '+a.name, '#ffd166');
    unlockedThisGame.push(a);
    SFX.ach();
  }
}
function checkAch(){
  if(!achievements['first_blast'] && stats.totalLines > 0) unlockAch('first_blast');
  if(!achievements['combo3'] && combo >= 3) unlockAch('combo3');
  if(!achievements['score500'] && score >= 500) unlockAch('score500');
  if(!achievements['score2000'] && score >= 2000) unlockAch('score2000');
  if(!achievements['bomber'] && stats.bombsUsed >= 5) unlockAch('bomber');
  if(!achievements['undo_master'] && stats.undosUsed >= 10) unlockAch('undo_master');
  if(!achievements['lines10'] && linesThisGame >= 10) unlockAch('lines10');
  if(!achievements['sprinter'] && mode === 'time' && score >= 1000) unlockAch('sprinter');
}

/* ═══════════ TASKS ═══════════ */
function checkTasksReset(){
  const today = new Date().toDateString();
  if(!tasks || typeof tasks !== 'object' || tasks.date !== today || !Array.isArray(tasks.items)){
    const shuf = TASK_POOL.slice().sort(function(){ return Math.random()-0.5; });
    tasks = {
      date: today,
      items: shuf.slice(0,3).map(function(t){
        return {id:t.id, text:t.text, target:t.target, reward:t.reward, track:t.track, done:false};
      }),
      progress: {lines:0, games:0, maxScore:0, bestCombo:0}
    };
    saveJSON('neonblast_tasks', tasks);
  }
  if(!tasks.progress || typeof tasks.progress !== 'object'){
    tasks.progress = {lines:0, games:0, maxScore:0, bestCombo:0};
  }
}
function updateTasks(track, val, isMax){
  if(!tasks || !tasks.progress) return;
  if(isMax){
    if(val > (tasks.progress[track]||0)) tasks.progress[track] = val;
  } else {
    tasks.progress[track] = (tasks.progress[track]||0) + val;
  }
  let changed = false;
  for(let i=0;i<tasks.items.length;i++){
    const item = tasks.items[i];
    if(item.done) continue;
    if((tasks.progress[item.track]||0) >= item.target){
      item.done = true;
      const rw = [];
      for(const k in item.reward){
        pendingPowers[k] = (pendingPowers[k]||0) + item.reward[k];
        rw.push((k==='bomb'?'💣':k==='undo'?'↩':'🔀')+'×'+item.reward[k]);
      }
      toast('✅', 'Задание: '+rw.join(' '), '#3ee07a');
      changed = true;
    }
  }
  if(changed) saveJSON('neonblast_pending', pendingPowers);
  saveJSON('neonblast_tasks', tasks);
}

/* ═══════════ DAILY BONUS ═══════════ */
function checkDailyBonus(){
  const today = new Date().toDateString();
  if(dailyBonus.lastClaim === today) return;
  const yesterday = new Date(Date.now()-86400000).toDateString();
  if(dailyBonus.lastClaim === yesterday) dailyBonus.streak = (dailyBonus.streak||0) + 1;
  else dailyBonus.streak = 1;
  dailyBonus.lastClaim = today;
  saveJSON('neonblast_bonus', dailyBonus);
  let reward;
  if(dailyBonus.streak >= 7) reward = {bomb:3, undo:2, shuffle:2};
  else if(dailyBonus.streak >= 5) reward = {bomb:2, undo:1, shuffle:1};
  else if(dailyBonus.streak >= 3) reward = {bomb:1, undo:1};
  else reward = {bomb:1};
  const parts = [];
  for(const k in reward){
    pendingPowers[k] = (pendingPowers[k]||0) + reward[k];
    parts.push((k==='bomb'?'💣':k==='undo'?'↩':'🔀')+'×'+reward[k]);
  }
  saveJSON('neonblast_pending', pendingPowers);
  toast('🎁', 'Бонус дня! Серия '+dailyBonus.streak+' — '+parts.join(' '), '#ffd166');
}

/* ═══════════ LEADERBOARD SAVE/LOAD ═══════════ */
function submitScore(name, sc){
  if(!name || sc <= 0) return;
  if(!Array.isArray(leaderboards[mode])) leaderboards[mode] = [];
  const lb = leaderboards[mode];
  lb.push({name:name, score:sc, date:Date.now()});
  lb.sort(function(a,b){ return b.score - a.score; });
  lb.length = Math.min(lb.length, 10);
  saveJSON('neonblast_lbs', leaderboards);
  lastSubmittedScore = sc;
  if(lb.length > 0 && lb[0].name === playerName && lb[0].score === sc) unlockAch('top1');
}

document.getElementById('importFile').addEventListener('change', function(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(evt){
    try {
      const imported = JSON.parse(evt.target.result);
      if(imported.classic || imported.time){
        leaderboards = imported;
        saveJSON('neonblast_lbs', leaderboards);
        toast('📂', 'Рейтинг успешно загружен', '#6ee7ff');
        state = 'menu'; // Возврат в меню для обновления
      }
    } catch(err){
      toast('❌', 'Ошибка чтения файла', '#ff4d8d');
    }
  };
  reader.readAsText(file);
  e.target.value = ''; // Сброс
});

/* ═══════════ GAME LOGIC ═══════════ */
function normalize(cells){
  let mR=Infinity, mC=Infinity;
  for(let i=0;i<cells.length;i++){
    if(cells[i][0]<mR) mR=cells[i][0];
    if(cells[i][1]<mC) mC=cells[i][1];
  }
  let rows=0, cols=0;
  const out = cells.map(function(p){
    const r=p[0]-mR, c=p[1]-mC;
    if(r+1>rows) rows=r+1; if(c+1>cols) cols=c+1;
    return [r,c];
  });
  return {cells:out, rows:rows, cols:cols};
}
function makePiece(){
  const r = Math.random();
  if(r < 0.04) return {cells:[[0,0]], rows:1, cols:1, color:0, special:'bomb'};
  if(r < 0.08) return {cells:[[0,0]], rows:1, cols:1, color:0, special:'rainbow'};
  let shape;
  if(r < 0.11) shape = [[0,0]];
  else if(r < 0.89) shape = SHAPES_SMALL[(Math.random()*SHAPES_SMALL.length)|0];
  else shape = SHAPES_BIG[(Math.random()*SHAPES_BIG.length)|0];
  const n = normalize(shape);
  return {cells:n.cells, rows:n.rows, cols:n.cols, color:(Math.random()*PALETTE.length)|0};
}
function newGame(){
  grid = [];
  for(let r=0;r<ROWS;r++){ const row=[]; for(let c=0;c<COLS;c++) row.push(null); grid.push(row); }
  score=0; combo=0; drag=null; bombMode=false;
  particles=[]; flashes=[]; shake=0; history=[];
  linesThisGame = 0; unlockedThisGame = [];
  lastSubmittedScore = -1;
  powers = {
    bomb:    2 + (pendingPowers.bomb||0),
    undo:    2 + (pendingPowers.undo||0),
    shuffle: 1 + (pendingPowers.shuffle||0)
  };
  pendingPowers = {bomb:0, undo:0, shuffle:0};
  saveJSON('neonblast_pending', pendingPowers);
  pieces = [makePiece(), makePiece(), makePiece()];
  timeLeft = mode === 'time' ? 60 : 0;
}
function fits(p, r0, c0){
  if(r0<0 || c0<0 || r0+p.rows>ROWS || c0+p.cols>COLS) return false;
  for(let i=0;i<p.cells.length;i++){
    if(grid[r0+p.cells[i][0]][c0+p.cells[i][1]] !== null) return false;
  }
  return true;
}
function canPlaceAny(){
  for(let i=0;i<3;i++){
    const p = pieces[i]; if(!p) continue;
    for(let r=0;r<=ROWS-p.rows;r++){
      for(let c=0;c<=COLS-p.cols;c++) if(fits(p,r,c)) return true;
    }
  }
  return false;
}
function burst(x, y, colorIdx, count){
  const pal = colorIdx === RAINBOW ? {light:'#ffffff', main:'#ffd166'} : (PALETTE[colorIdx] || PALETTE[0]);
  for(let i=0;i<count;i++){
    const a = Math.random()*Math.PI*2;
    const sp = 0.6 + Math.random()*3.2;
    particles.push({
      x:x, y:y,
      vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-1.2,
      life:1, decay:0.012+Math.random()*0.016,
      size:2+Math.random()*4,
      color: Math.random()<0.5 ? pal.light : pal.main
    });
  }
}
function endGame(){
  if(state !== 'playing') return;
  state = 'over';
  stats.games = (stats.games||0) + 1;
  stats.totalScore = (stats.totalScore||0) + score;
  if((stats.best||0) < score) stats.best = score;
  if(combo > (stats.bestCombo||0)) stats.bestCombo = combo;
  saveJSON('neonblast_stats', stats);
  updateTasks('games', 1, false);
  updateTasks('maxScore', score, true);
  submitScore(playerName, score);
  checkAch();
  SFX.over();
}
function clearLines(){
  const fullRows = [], fullCols = [];
  for(let r=0;r<ROWS;r++){
    let ok = true;
    for(let c=0;c<COLS;c++) if(grid[r][c] === null){ ok=false; break; }
    if(ok) fullRows.push(r);
  }
  for(let c=0;c<COLS;c++){
    let ok = true;
    for(let r=0;r<ROWS;r++) if(grid[r][c] === null){ ok=false; break; }
    if(ok) fullCols.push(c);
  }
  const lines = fullRows.length + fullCols.length;
  if(lines === 0){ combo = 0; return 0; }
  combo++;
  const marked = {};
  for(let i=0;i<fullRows.length;i++){
    const r = fullRows[i];
    for(let c=0;c<COLS;c++) marked[r*COLS+c] = grid[r][c];
  }
  for(let i=0;i<fullCols.length;i++){
    const c = fullCols[i];
    for(let r=0;r<ROWS;r++) marked[r*COLS+c] = grid[r][c];
  }
  for(const key in marked){
    const k = +key, r = (k/COLS)|0, c = k%COLS;
    const val = marked[key];
    if(val === null) continue;
    burst(BX+c*CELL+CELL/2, BY+r*CELL+CELL/2, val, val === RAINBOW ? 12 : 7);
    flashes.push({x:BX+c*CELL, y:BY+r*CELL, life:1});
    grid[r][c] = null;
  }
  const base = lines*20 + (lines-1)*30;
  score += base * combo;
  stats.totalLines = (stats.totalLines||0) + lines;
  linesThisGame += lines;
  updateTasks('lines', lines, false);
  if(combo > (stats.bestCombo||0)){ stats.bestCombo = combo; saveJSON('neonblast_stats', stats); }
  updateTasks('bestCombo', combo, true);
  shake = Math.min(14, 4 + lines*3);
  SFX.clear(lines);
  if(combo > 1) setTimeout(function(){ SFX.combo(combo); }, 110);
  checkAch();
  return lines;
}
function explodeAt(r0, c0){
  let destroyed = 0;
  for(let dr=-1;dr<=1;dr++){
    for(let dc=-1;dc<=1;dc++){
      const rr = r0+dr, cc = c0+dc;
      if(rr<0||cc<0||rr>=ROWS||cc>=COLS) continue;
      if(grid[rr][cc] !== null){
        burst(BX+cc*CELL+CELL/2, BY+rr*CELL+CELL/2, grid[rr][cc], 8);
        flashes.push({x:BX+cc*CELL, y:BY+rr*CELL, life:1});
        grid[rr][cc] = null;
        destroyed++;
      }
    }
  }
  score += destroyed * 8;
  shake = Math.max(shake, 10);
  SFX.bomb();
  return destroyed;
}
function place(idx, r0, c0){
  if(state !== 'playing') return;
  const p = pieces[idx];
  if(!p) return;
  history.push({
    grid: grid.map(function(row){ return row.slice(); }),
    pieces: pieces.slice(), score: score, combo: combo
  });
  if(history.length > 12) history.shift();

  if(p.special === 'bomb'){
    pieces[idx] = null;
    explodeAt(r0, c0);
    clearLines();
    if(score > (stats.best||0)) stats.best = score;
    if(pieces[0]===null && pieces[1]===null && pieces[2]===null){
      pieces = [makePiece(), makePiece(), makePiece()];
    }
    if(!canPlaceAny()) endGame();
    return;
  }

  const val = p.special === 'rainbow' ? RAINBOW : p.color;
  for(let i=0;i<p.cells.length;i++){
    grid[r0+p.cells[i][0]][c0+p.cells[i][1]] = val;
  }
  pieces[idx] = null;
  score += p.cells.length * 2;
  SFX.place();
  clearLines();
  if(pieces[0]===null && pieces[1]===null && pieces[2]===null){
    pieces = [makePiece(), makePiece(), makePiece()];
  }
  if(score > (stats.best||0)) stats.best = score;
  checkAch();
  if(!canPlaceAny()) endGame();
}
function doUndo(){
  if(powers.undo <= 0 || history.length === 0 || state !== 'playing') return;
  const h = history.pop();
  grid = h.grid; pieces = h.pieces; score = h.score; combo = h.combo;
  powers.undo--;
  stats.undosUsed = (stats.undosUsed||0) + 1;
  saveJSON('neonblast_stats', stats);
  SFX.undo();
  checkAch();
}
function doShuffle(){
  if(powers.shuffle <= 0 || state !== 'playing') return;
  const n = [];
  for(let i=0;i<3;i++) n.push(pieces[i] ? makePiece() : null);
  pieces = n;
  if(pieces[0]===null && pieces[1]===null && pieces[2]===null){
    pieces = [makePiece(), makePiece(), makePiece()];
  }
  powers.shuffle--;
  SFX.shuffle();
  if(!canPlaceAny()) endGame();
}
function handleBombPower(px, py){
  if(px < BX || px > BX+BW || py < BY || py > BY+BH){ bombMode = false; return; }
  const c = Math.floor((px-BX)/CELL);
  const r = Math.floor((py-BY)/CELL);
  explodeAt(r, c);
  powers.bomb--;
  stats.bombsUsed = (stats.bombsUsed||0) + 1;
  saveJSON('neonblast_stats', stats);
  bombMode = false;
  checkAch();
  clearLines();
  if(!canPlaceAny()) endGame();
}

/* ═══════════ INPUT ═══════════ */
function getPos(e){
  const r = canvas.getBoundingClientRect();
  return {x:(e.clientX-r.left)/r.width*W, y:(e.clientY-r.top)/r.height*H};
}
function hit(p, b){ return p.x>=b.x && p.x<=b.x+b.w && p.y>=b.y && p.y<=b.y+b.h; }
function trayBox(i, pc){
  const size = Math.min(24, 88/Math.max(pc.rows, pc.cols));
  const w = pc.cols*size, h = pc.rows*size;
  return {x:SLOT_X[i]-w/2, y:TRAY_Y-h/2, w:w, h:h, size:size};
}
function updateSnap(){
  if(!drag) return;
  const pc = pieces[drag.i];
  if(!pc){ drag = null; return; }
  const c = Math.round((drag.x-BX)/CELL);
  const r = Math.round((drag.y-BY)/CELL);
  drag.r = r; drag.c = c;
  drag.valid = fits(pc, r, c);
}
function startDrag(i, p, isTouch){
  const pc = pieces[i];
  const lift = isTouch ? 62 : 0;
  const px = SLOT_X[i] - pc.cols*CELL/2;
  const py = TRAY_Y - pc.rows*CELL/2 - lift;
  drag = {i:i, x:px, y:py, ox:p.x-px, oy:p.y-py, r:0, c:0, valid:false};
  updateSnap();
}

/* ═══════════ BUTTONS ═══════════ */
const BTN_MENU_CLASSIC = {x:W/2-130, y:240, w:260, h:66};
const BTN_MENU_TIME    = {x:W/2-130, y:318, w:260, h:66};
const BTN_MENU_ICONS = [
  {x:W/2-190, y:412, w:88, h:88, icon:'🏆', label:'Рейтинг', screen:'leaderboard'},
  {x:W/2-100, y:412, w:88, h:88, icon:'📋', label:'Задания', screen:'tasks'},
  {x:W/2-10,  y:412, w:88, h:88, icon:'🎨', label:'Темы',    screen:'themes'},
  {x:W/2+80,  y:412, w:88, h:88, icon:'👤', label:'Профиль', screen:'stats'},
];
const BTN_CHANGE_NAME_MENU = {x:W/2-90, y:600, w:180, h:44};

const BTN_OVER_AGAIN  = {x:W/2-110, y:400, w:220, h:54};
const BTN_OVER_RATING = {x:W/2-110, y:462, w:220, h:46};
const BTN_OVER_MENU   = {x:W/2-110, y:518, w:220, h:46};

const BTN_BACK = {x:W/2-90, y:640, w:180, h:50};
const TAB_CLASSIC = {x:W/2-120, y:66, w:115, h:34};
const TAB_TIME    = {x:W/2+5,   y:66, w:115, h:34};

// Кнопки сохранения/загрузки рейтинга (внутри экрана рейтинга)
const BTN_EXPORT_LB = {x:30, y:640, w:150, h:40};
const BTN_IMPORT_LB = {x:W-180, y:640, w:150, h:40};

const TROPHY_BTN = {x:W-58, y:80, w:44, h:44};

canvas.addEventListener('pointerdown', function(e){
  e.preventDefault();
  initAudio();
  const p = getPos(e);

  if(!playerName) return;
  if(nameScreen.classList.contains('hidden') === false) return;

  /* MENU */
  if(state === 'menu'){
    if(hit(p, BTN_MENU_CLASSIC)){ mode='classic'; state='playing'; newGame(); return; }
    if(hit(p, BTN_MENU_TIME)){ mode='time'; state='playing'; newGame(); return; }
    for(let i=0;i<BTN_MENU_ICONS.length;i++){
      const b = BTN_MENU_ICONS[i];
      if(hit(p, b)){
        prevScreen = 'menu';
        state = b.screen;
        if(b.screen === 'leaderboard') leaderboardTab = mode;
        return;
      }
    }
    if(hit(p, BTN_CHANGE_NAME_MENU)){ openNameScreen('menu'); return; }
    return;
  }

  /* GAME OVER */
  if(state === 'over'){
    if(hit(p, BTN_OVER_AGAIN)){ newGame(); state='playing'; return; }
    if(hit(p, BTN_OVER_RATING)){ prevScreen='over'; state='leaderboard'; leaderboardTab=mode; return; }
    if(hit(p, BTN_OVER_MENU)){ state='menu'; return; }
    return;
  }

  /* LEADERBOARD */
  if(state === 'leaderboard'){
    if(hit(p, TAB_CLASSIC)){ leaderboardTab='classic'; return; }
    if(hit(p, TAB_TIME)){ leaderboardTab='time'; return; }
    if(hit(p, BTN_EXPORT_LB)){ exportLeaderboards(); return; }
    if(hit(p, BTN_IMPORT_LB)){ document.getElementById('importFile').click(); return; }
    if(hit(p, BTN_BACK)){ state = prevScreen; return; }
    return;
  }

  /* TASKS / THEMES / STATS */
  if(state === 'tasks' || state === 'themes' || state === 'stats'){
    if(hit(p, BTN_BACK)){ state = prevScreen; return; }
    if(state === 'themes'){
      for(let i=0;i<THEMES.length;i++){
        const col = i % 2, row = (i/2)|0;
        const bx = W/2 - 160 + col*160, by = 140 + row*130;
        const box = {x:bx, y:by, w:140, h:110};
        if(hit(p, box)){
          if((stats.best||0) >= THEME_UNLOCK[i]){
            theme = i;
            saveJSON('neonblast_theme', theme);
            if(!achievements['stylist']) unlockAch('stylist');
            SFX.place();
          }
          return;
        }
      }
    }
    return;
  }

  /* PLAYING */
  if(state !== 'playing') return;

  if(hit(p, TROPHY_BTN)){
    drag = null; bombMode = false;
    prevScreen = 'playing';
    state = 'leaderboard'; leaderboardTab = mode;
    return;
  }
  for(let i=0;i<3;i++){
    const cx = POWER_X[i], cy = POWERS_Y;
    if(p.x>=cx-48 && p.x<=cx+48 && p.y>=cy-26 && p.y<=cy+26){
      const key = POWERS[i].key;
      if(powers[key] <= 0) return;
      if(key === 'bomb'){ bombMode = !bombMode; }
      else if(key === 'undo'){ doUndo(); }
      else if(key === 'shuffle'){ doShuffle(); }
      return;
    }
  }
  if(bombMode){ handleBombPower(p.x, p.y); return; }
  for(let i=0;i<3;i++){
    const pc = pieces[i];
    if(!pc) continue;
    const b = trayBox(i, pc);
    if(p.x>=b.x-14 && p.x<=b.x+b.w+14 && p.y>=b.y-14 && p.y<=b.y+b.h+14){
      startDrag(i, p, e.pointerType === 'touch' || e.pointerType === 'pen');
      return;
    }
  }
}, {passive:false});

window.addEventListener('pointermove', function(e){
  if(!drag) return;
  e.preventDefault();
  const p = getPos(e);
  drag.x = p.x - drag.ox;
  drag.y = p.y - drag.oy;
  updateSnap();
}, {passive:false});
window.addEventListener('pointerup', function(e){
  if(!drag) return;
  e.preventDefault();
  if(drag.valid && pieces[drag.i]) place(drag.i, drag.r, drag.c);
  drag = null;
}, {passive:false});
window.addEventListener('pointercancel', function(){ drag = null; });
canvas.addEventListener('contextmenu', function(e){ e.preventDefault(); });

/* ═══════════ RENDERING ═══════════ */
function currentTheme(){ return THEMES[theme] || THEMES[0]; }
function text(str, x, y, size, color, align, weight){
  ctx.font = (weight||'bold')+' '+size+'px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
  ctx.fillStyle = color;
  ctx.textAlign = align || 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText(str, x, y);
}
function fmt(n){ return n.toLocaleString('ru-RU'); }

function drawBg(t){
  const th = currentTheme();
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0, th.bg[0]);
  g.addColorStop(0.45, th.bg[1]);
  g.addColorStop(1, th.bg[2]);
  ctx.fillStyle = g;
  ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation = 'lighter';
  for(let i=0;i<3;i++){
    const x = W*(0.2+0.3*i) + Math.sin(t*0.00028+i*1.9)*70;
    const y = H*(0.22+0.26*i) + Math.cos(t*0.00035+i*2.4)*90;
    const rg = ctx.createRadialGradient(x,y,0,x,y,230);
    rg.addColorStop(0, i===0 ? 'rgba(130,60,255,0.16)' : i===1 ? 'rgba(30,140,255,0.13)' : 'rgba(255,50,150,0.11)');
    rg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = rg;
    ctx.fillRect(x-230, y-230, 460, 460);
  }
  ctx.globalCompositeOperation = 'source-over';
}

function drawBlock(x, y, s, pal, alpha){
  if(alpha === undefined) alpha = 1;
  if(alpha <= 0) return;
  const pad = s*0.07, rad = s*0.22;
  ctx.globalAlpha = alpha*0.30;
  ctx.fillStyle = pal.glow;
  ctx.beginPath(); ctx.roundRect(x-pad*0.6, y-pad*0.6, s+pad*1.2, s+pad*1.2, rad+2); ctx.fill();
  ctx.globalAlpha = alpha;
  const g = ctx.createLinearGradient(x,y,x+s*0.45,y+s);
  g.addColorStop(0,pal.light); g.addColorStop(0.5,pal.main); g.addColorStop(1,pal.dark);
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.roundRect(x+1,y+1,s-2,s-2,rad); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.30)';
  ctx.beginPath(); ctx.roundRect(x+s*0.17,y+s*0.13,s*0.66,s*0.19,s*0.10); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.13)';
  ctx.beginPath(); ctx.roundRect(x+s*0.17,y+s*0.68,s*0.66,s*0.13,s*0.07); ctx.fill();
  ctx.globalAlpha = 1;
}
function drawRainbow(x, y, s, alpha){
  if(alpha === undefined) alpha = 1;
  const tm = performance.now()*0.001;
  ctx.globalAlpha = alpha*0.4;
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.roundRect(x-2,y-2,s+4,s+4,s*0.28); ctx.fill();
  ctx.globalAlpha = alpha;
  const g = ctx.createLinearGradient(x,y,x+s,y+s);
  for(let i=0;i<7;i++){
    const hue = (tm*70 + i*51) % 360;
    g.addColorStop(i/6, 'hsl('+hue+',90%,62%)');
  }
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.roundRect(x+1,y+1,s-2,s-2,s*0.22); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.beginPath(); ctx.roundRect(x+s*0.17,y+s*0.13,s*0.66,s*0.19,s*0.10); ctx.fill();
  ctx.globalAlpha = 1;
}
function drawCell(x, y, s, val, alpha){
  if(val === RAINBOW) drawRainbow(x, y, s, alpha);
  else drawBlock(x, y, s, PALETTE[val] || PALETTE[0], alpha);
}
function drawPieceCell(x, y, s, pc, alpha){
  if(pc.special === 'bomb'){
    drawBlock(x, y, s, PALETTE[0], alpha);
    ctx.globalAlpha = alpha === undefined ? 1 : alpha;
    ctx.font = (s*0.7)+'px system-ui,"Apple Color Emoji","Segoe UI Emoji"';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('💣', x+s/2, y+s/2+1);
    ctx.globalAlpha = 1;
  } else if(pc.special === 'rainbow'){
    drawRainbow(x, y, s, alpha);
  } else {
    drawBlock(x, y, s, PALETTE[pc.color] || PALETTE[0], alpha);
  }
}

function drawBoard(t){
  ctx.save();
  ctx.shadowColor = 'rgba(115,80,255,0.55)'; ctx.shadowBlur = 26;
  ctx.fillStyle = 'rgba(255,255,255,0.035)';
  ctx.beginPath(); ctx.roundRect(BX-10,BY-10,BW+20,BH+20,22); ctx.fill();
  ctx.restore();
  ctx.strokeStyle = 'rgba(145,115,255,0.42)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.roundRect(BX-10,BY-10,BW+20,BH+20,22); ctx.stroke();
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    const x = BX+c*CELL, y = BY+r*CELL;
    ctx.fillStyle = 'rgba(255,255,255,0.048)';
    ctx.beginPath(); ctx.roundRect(x+3,y+3,CELL-6,CELL-6,9); ctx.fill();
  }
  if(bombMode){
    const pulse = 0.10 + Math.sin(t*0.008)*0.05;
    ctx.fillStyle = 'rgba(255,70,110,'+pulse.toFixed(3)+')';
    ctx.beginPath(); ctx.roundRect(BX,BY,BW,BH,12); ctx.fill();
  }
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    const v = grid[r][c];
    if(v !== null) drawCell(BX+c*CELL, BY+r*CELL, CELL, v);
  }
  if(drag && drag.valid && pieces[drag.i] && !bombMode) drawGhost();
}
function drawGhost(){
  const pc = pieces[drag.i];
  const r0 = drag.r, c0 = drag.c;
  function occ(r, c){
    const dr = r-r0, dc = c-c0;
    for(let i=0;i<pc.cells.length;i++){
      if(pc.cells[i][0]===dr && pc.cells[i][1]===dc) return true;
    }
    return grid[r][c] !== null;
  }
  for(let r=0;r<ROWS;r++){
    let full = true;
    for(let c=0;c<COLS;c++) if(!occ(r,c)){ full=false; break; }
    if(full){ ctx.fillStyle='rgba(255,255,255,0.10)'; ctx.fillRect(BX, BY+r*CELL, BW, CELL); }
  }
  for(let c=0;c<COLS;c++){
    let full = true;
    for(let r=0;r<ROWS;r++) if(!occ(r,c)){ full=false; break; }
    if(full){ ctx.fillStyle='rgba(255,255,255,0.10)'; ctx.fillRect(BX+c*CELL, BY, CELL, BH); }
  }
  for(let i=0;i<pc.cells.length;i++){
    drawPieceCell(BX+(c0+pc.cells[i][1])*CELL, BY+(r0+pc.cells[i][0])*CELL, CELL, pc, 0.36);
  }
}
function drawTray(t){
  for(let i=0;i<3;i++){
    const pc = pieces[i];
    if(!pc) continue;
    if(drag && drag.i === i) continue;
    const size = Math.min(24, 88/Math.max(pc.rows, pc.cols));
    const w = pc.cols*size, h = pc.rows*size;
    const float = Math.sin(t*0.0022+i*1.7)*3;
    const x = SLOT_X[i] - w/2;
    const y = TRAY_Y - h/2 + float;
    for(let k=0;k<pc.cells.length;k++){
      drawPieceCell(x+pc.cells[k][1]*size, y+pc.cells[k][0]*size, size, pc);
    }
  }
}
function drawDrag(){
  if(!drag || !pieces[drag.i]) return;
  const pc = pieces[drag.i];
  const a = drag.valid ? 1 : 0.55;
  for(let k=0;k<pc.cells.length;k++){
    drawPieceCell(drag.x+pc.cells[k][1]*CELL, drag.y+pc.cells[k][0]*CELL, CELL, pc, a);
  }
}

function drawPowers(){
  for(let i=0;i<3;i++){
    const key = POWERS[i].key;
    const cx = POWER_X[i], cy = POWERS_Y;
    const w = 96, h = 52;
    const count = powers[key]||0;
    const active = (key === 'bomb' && bombMode);
    const enabled = count > 0;
    ctx.save();
    ctx.globalAlpha = enabled ? 1 : 0.28;
    const g = ctx.createLinearGradient(cx-w/2,cy-h/2,cx-w/2,cy+h/2);
    if(active){ g.addColorStop(0,'#ff6b8f'); g.addColorStop(1,'#c2185b'); }
    else { g.addColorStop(0,'rgba(255,255,255,0.13)'); g.addColorStop(1,'rgba(255,255,255,0.045)'); }
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.roundRect(cx-w/2, cy-h/2, w, h, 16); ctx.fill();
    ctx.strokeStyle = active ? 'rgba(255,255,255,0.9)' : 'rgba(255,255,255,0.16)';
    ctx.lineWidth = 2; ctx.stroke();
    ctx.font = '23px system-ui,"Apple Color Emoji","Segoe UI Emoji"';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fff';
    ctx.fillText(POWERS[i].icon, cx-9, cy+1);
    ctx.font = 'bold 15px system-ui,sans-serif';
    ctx.fillStyle = enabled ? '#ffd166' : '#888';
    ctx.fillText('×'+count, cx+27, cy+1);
    ctx.restore();
  }
}
function drawParticles(){
  for(let i=0;i<particles.length;i++){
    const p = particles[i];
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    const s = p.size*(0.4 + p.life*0.6);
    ctx.beginPath(); ctx.roundRect(p.x-s/2, p.y-s/2, s, s, s*0.35); ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function drawFlashes(){
  for(let i=0;i<flashes.length;i++){
    const f = flashes[i];
    const k = 1-f.life;
    ctx.globalAlpha = f.life*0.55;
    ctx.fillStyle = '#ffffff';
    const grow = k*CELL*0.35;
    ctx.beginPath(); ctx.roundRect(f.x-grow/2, f.y-grow/2, CELL+grow, CELL+grow, 10); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/* ═══════════ MAIN LOOP ═══════════ */
function update(dt){
  const f = dt/16.6667;
  if(particles){
    for(let i=particles.length-1;i>=0;i--){
      const p = particles[i];
      p.x += p.vx*f; p.y += p.vy*f; p.vy += 0.16*f; p.vx *= 0.985;
      p.life -= p.decay*f;
      if(p.life <= 0) particles.splice(i,1);
    }
  }
  if(flashes){
    for(let i=flashes.length-1;i>=0;i--){
      flashes[i].life -= 0.055*f;
      if(flashes[i].life <= 0) flashes.splice(i,1);
    }
  }
  if(shake > 0){ shake -= 0.55*f; if(shake < 0) shake = 0; }

  if(state === 'playing' && mode === 'time'){
    timeLeft -= dt/1000;
    if(timeLeft <= 0){ timeLeft = 0; endGame(); }
  }
}

function render(t){
  ctx.clearRect(0,0,W,H);
  drawBg(t);

  if(state === 'menu'){
    drawMenu(t);
  } else if(state === 'playing' || state === 'over'){
    ctx.save();
    if(shake > 0.5) ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
    drawBoard(t);
    drawParticles();
    drawFlashes();
    ctx.restore();
    drawTray(t);
    drawHeader();
    drawPowers();
    drawDrag();
    if(state === 'over') drawOverScreen();
  } else if(state === 'leaderboard'){
    drawLeaderboard();
  } else if(state === 'tasks'){
    drawTasksScreen();
  } else if(state === 'themes'){
    drawThemesScreen();
  } else if(state === 'stats'){
    drawStatsScreen();
  }

  drawToasts();
}

let lastT = 0;
function loop(t){
  if(!lastT) lastT = t;
  let dt = t - lastT; lastT = t;
  if(dt > 60) dt = 60;
  update(dt);
  render(t);
  requestAnimationFrame(loop);
}

/* ═══════════ STARTUP ═══════════ */
resize();
checkTasksReset();

if(!playerName){
  nameScreen.classList.remove('hidden');
} else {
  nameScreen.classList.add('hidden');
  setTimeout(function(){ checkDailyBonus(); }, 600);
}
state = 'menu';

requestAnimationFrame(loop);

})();
</script>
</body>
